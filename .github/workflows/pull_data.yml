name: Nightly data pull

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install yfinance fredapi pandas numpy pyarrow python-dotenv

      - name: Pull and rebuild
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd src
          python ingest.py
          python features.py
          python -c "import features as F; F.build_dataset(save=True, horizon=1)"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/dataset.parquet data/processed/dataset_h1.parquet
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi