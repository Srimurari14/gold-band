name: Log daily prediction

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install pandas numpy pyarrow arch scipy python-dotenv \
                      scikit-learn lightgbm xgboost catboost

      - name: Log today's predictions
        run: |
          cd src
          python log_prediction.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/predictions.csv logs/daily_predictions.csv logs/fx_predictions.csv
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "log: prediction $(date -u +%Y-%m-%d)"
            git push
          fi